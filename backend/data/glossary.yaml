# ---------------------------------------------------------------------------
# glossary.yaml — ru/en синонимы отраслевых терминов (ARCHITECTURE.md §4.4).
#
# СТАРТОВЫЙ КУРИРОВАННЫЙ ГЛОССАРИЙ горно-металлургического домена Норникеля.
# Заменить/дополнить справочником терминов кейса — формат тот же.
#
# Применяется КОДОМ (canonizer.py), не LLM: canonizer раскрывает каждый список
# синонимов в алиасы одной канонической сущности. load_references.py дозаполняет
# name_en / aliases сущностям справочников англоязычными синонимами отсюда
# (минимум — гарантировать en-алиасы сущностям шести демо-сценариев §1).
#
# Структура:
#   canonical_id:                # тот же slug, что в reference/*.csv (если сущность там есть)
#     label: Material|Process|Equipment|Parameter   # метка узла (§3.2), опционально
#     ru: [синоним, синоним...]  # русские написания/сокращения
#     en: [synonym, ...]         # англоязычные (первый — предпочтительный name_en)
#
# canonical_id совпадает с ключом в CSV → load_references сшивает en-алиасы с узлом.
# Если сущности нет в CSV, глоссарий всё равно даёт canonizer'у alias->canonical_id
# группу (unresolved останется до загрузки соответствующего справочника).
# ---------------------------------------------------------------------------

