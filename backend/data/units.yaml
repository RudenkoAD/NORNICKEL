# Единицы измерения и конвертации — детерминированное ядро числового контура
# (ARCHITECTURE.md §3.1, §4.3, инвариант №1: числа парсит только код, никогда LLM).
#
# Структура:
#   categories:  ТИП параметра → каноническая единица (в неё конвертируется всё) +
#                abs_delta для оператора «~» при v==0 (§3.1: нет дельты → needs_review).
#   units:       любое написание единицы (латиница/кириллица, «3» вместо «³», …) →
#                {category, multiplier, offset}. Конвертация в каноническую:
#                    value_canon = value * multiplier + offset
#                Каноническая единица категории имеет multiplier=1, offset=0.
#
# Одни и те же данные использует импорт (units.py при записи) и query-сторона
# (units.py при разборе фильтров запроса, §5.2). Нераспознанная единица НЕ
# конвертируется наугад — уходит в фоллбек-контур unknown_units (§4.3, уровень 2).

categories:
  concentration:
    canonical_unit: "мг/л"
    abs_delta: 10.0          # ±10 мг/л для «около 0» концентрации
  temperature:
    canonical_unit: "°C"
    abs_delta: 2.0           # ±2 °C (§3.1, пример)
  flow_rate:
    canonical_unit: "м³/ч"
    abs_delta: 0.5
  pressure:
    canonical_unit: "МПа"
    abs_delta: 0.05
  ph:
    canonical_unit: "pH"
    abs_delta: 0.5           # ±0.5 pH (§3.1, пример)
  economic:
    canonical_unit: "руб/т"
    abs_delta: null          # для денег «около 0» бессмысленно → needs_review
  environment:
    canonical_unit: null     # категориальные условия среды — value_text, без чисел
    abs_delta: null
  mass_rate:
    canonical_unit: "т/сут"
    abs_delta: 0.1
  current_density:
    canonical_unit: "А/м²"
    abs_delta: 5.0
  voltage:
    canonical_unit: "В"
    abs_delta: 0.1
  recovery:
    canonical_unit: "%"
    abs_delta: 1.0           # степень извлечения / выход / доля, «около 0» → ±1 %
  time:
    canonical_unit: "мин"
    abs_delta: 1.0           # 03.07: время выдержки/продувки в статьях («минут», «ч»)
  density:
    canonical_unit: "г/см³"
    abs_delta: 0.05          # 03.07: таблицы плотности расплавов (статья №17)
  viscosity:
    canonical_unit: "Па·с"
    abs_delta: 0.001         # 03.07: кинематическая/динамическая вязкость (пуазы)
  size:
    canonical_unit: "мкм"
    abs_delta: 1.0           # 03.07: размер частиц/корольков
  mass:
    canonical_unit: "г"
    abs_delta: 0.1           # 03.07-2: навески в лабораторных опытах (qwen)
  volume:
    canonical_unit: "л"
    abs_delta: 0.1
  # 03.07-3 (консолидация по живому графу): категории геомеханики/сейсмики. В корпусе
  # есть документы по буровзрывным работам и напряжённо-деформированному состоянию
  # массива (скважины, датчики, сейсмовзрывные волны) — их числа флагались как
  # unknown_units (алерт §4.3). Единицы физически однозначны, конвертации точны.
  length:
    canonical_unit: "м"
    abs_delta: 0.01          # геометрия блоков/скважин/шагов сетки (м, см)
  frequency:
    canonical_unit: "Гц"
    abs_delta: 0.1           # диапазон частот сейсмовзрывных волн
  velocity:
    canonical_unit: "м/с"
    abs_delta: 0.1           # скорость продольных волн, скорость смещения (PVS)
  angle:
    canonical_unit: "град"
    abs_delta: 0.5           # угол падения, наклон скважин
  area:
    canonical_unit: "см²"
    abs_delta: 0.1           # требуемое армирование сечения (см²)
  energy:
    canonical_unit: "Дж"
    abs_delta: 1.0           # энергия сейсмособытия (Дж)
  other:
    canonical_unit: null
    abs_delta: null

units:
  # --- Концентрация → мг/л ---
  "мг/л":     {category: concentration, multiplier: 1.0, offset: 0.0}
  "mg/l":     {category: concentration, multiplier: 1.0, offset: 0.0}
  "mg/L":     {category: concentration, multiplier: 1.0, offset: 0.0}
  "мг/дм³":   {category: concentration, multiplier: 1.0, offset: 0.0}
  "мг/дм3":   {category: concentration, multiplier: 1.0, offset: 0.0}
  "mg/dm³":   {category: concentration, multiplier: 1.0, offset: 0.0}
  "mg/dm3":   {category: concentration, multiplier: 1.0, offset: 0.0}
  "г/л":      {category: concentration, multiplier: 1000.0, offset: 0.0}
  "g/l":      {category: concentration, multiplier: 1000.0, offset: 0.0}
  "g/L":      {category: concentration, multiplier: 1000.0, offset: 0.0}
  "г/дм³":    {category: concentration, multiplier: 1000.0, offset: 0.0}
  "г/дм3":    {category: concentration, multiplier: 1000.0, offset: 0.0}
  "g/dm³":    {category: concentration, multiplier: 1000.0, offset: 0.0}
  "g/dm3":    {category: concentration, multiplier: 1000.0, offset: 0.0}
  "мкг/л":    {category: concentration, multiplier: 0.001, offset: 0.0}
  "мкг/дм³":  {category: concentration, multiplier: 0.001, offset: 0.0}
  "µg/l":     {category: concentration, multiplier: 0.001, offset: 0.0}
  "мг/мл":    {category: concentration, multiplier: 1000.0, offset: 0.0}
  "mg/ml":    {category: concentration, multiplier: 1000.0, offset: 0.0}
  "г/м³":     {category: concentration, multiplier: 1.0, offset: 0.0}
  "г/м3":     {category: concentration, multiplier: 1.0, offset: 0.0}

  # --- Температура → °C ---
  "°C":       {category: temperature, multiplier: 1.0, offset: 0.0}
  "°с":       {category: temperature, multiplier: 1.0, offset: 0.0}
  "℃":        {category: temperature, multiplier: 1.0, offset: 0.0}
  "C":        {category: temperature, multiplier: 1.0, offset: 0.0}
  "град C":   {category: temperature, multiplier: 1.0, offset: 0.0}
  "градусов": {category: temperature, multiplier: 1.0, offset: 0.0}
  "K":        {category: temperature, multiplier: 1.0, offset: -273.15}
  "К":        {category: temperature, multiplier: 1.0, offset: -273.15}
  "°K":       {category: temperature, multiplier: 1.0, offset: -273.15}
  # Пополнение 03.07 (алерт unknown_units, статьи corpus/): в русских текстах градус
  # часто набирают кириллической «о» вместо «°», а «С» — заглавная кириллица.
  "оС":       {category: temperature, multiplier: 1.0, offset: 0.0}   # кир.«о» + кир.«С»
  "оC":       {category: temperature, multiplier: 1.0, offset: 0.0}   # кир.«о» + лат.«C»
  "oС":       {category: temperature, multiplier: 1.0, offset: 0.0}   # лат.«o» + кир.«С»
  "С":        {category: temperature, multiplier: 1.0, offset: 0.0}   # голая кир. «С» («1300 С»)
  "гр.С":     {category: temperature, multiplier: 1.0, offset: 0.0}
  "град.С":   {category: temperature, multiplier: 1.0, offset: 0.0}

  # --- Расход / скорость потока → м³/ч ---
  "м³/ч":     {category: flow_rate, multiplier: 1.0, offset: 0.0}
  "м3/ч":     {category: flow_rate, multiplier: 1.0, offset: 0.0}
  "m³/h":     {category: flow_rate, multiplier: 1.0, offset: 0.0}
  "m3/h":     {category: flow_rate, multiplier: 1.0, offset: 0.0}
  "л/мин":    {category: flow_rate, multiplier: 0.06, offset: 0.0}     # 1 л/мин = 0.06 м³/ч
  "l/min":    {category: flow_rate, multiplier: 0.06, offset: 0.0}
  "л/ч":      {category: flow_rate, multiplier: 0.001, offset: 0.0}
  "l/h":      {category: flow_rate, multiplier: 0.001, offset: 0.0}
  "л/с":      {category: flow_rate, multiplier: 3.6, offset: 0.0}      # 1 л/с = 3.6 м³/ч
  "l/s":      {category: flow_rate, multiplier: 3.6, offset: 0.0}
  "м³/сут":   {category: flow_rate, multiplier: 0.0416667, offset: 0.0}  # /24
  "м3/сут":   {category: flow_rate, multiplier: 0.0416667, offset: 0.0}

  # --- Давление → МПа ---
  "МПа":      {category: pressure, multiplier: 1.0, offset: 0.0}
  "MPa":      {category: pressure, multiplier: 1.0, offset: 0.0}
  "кПа":      {category: pressure, multiplier: 0.001, offset: 0.0}
  "kPa":      {category: pressure, multiplier: 0.001, offset: 0.0}
  "Па":       {category: pressure, multiplier: 0.000001, offset: 0.0}
  "Pa":       {category: pressure, multiplier: 0.000001, offset: 0.0}
  "атм":      {category: pressure, multiplier: 0.101325, offset: 0.0}
  "atm":      {category: pressure, multiplier: 0.101325, offset: 0.0}
  "бар":      {category: pressure, multiplier: 0.1, offset: 0.0}
  "bar":      {category: pressure, multiplier: 0.1, offset: 0.0}
  "кгс/см²":  {category: pressure, multiplier: 0.0980665, offset: 0.0}
  "кгс/см2":  {category: pressure, multiplier: 0.0980665, offset: 0.0}

  # --- pH (безразмерный, но со своей категорией и дельтой) ---
  "pH":       {category: ph, multiplier: 1.0, offset: 0.0}
  "рН":       {category: ph, multiplier: 1.0, offset: 0.0}
  "ед. pH":   {category: ph, multiplier: 1.0, offset: 0.0}

  # --- Массовый расход / производительность → т/сут ---
  "т/сут":    {category: mass_rate, multiplier: 1.0, offset: 0.0}
  "т/сутки":  {category: mass_rate, multiplier: 1.0, offset: 0.0}
  "t/day":    {category: mass_rate, multiplier: 1.0, offset: 0.0}
  "кг/ч":     {category: mass_rate, multiplier: 0.024, offset: 0.0}   # 1 кг/ч = 0.024 т/сут
  "kg/h":     {category: mass_rate, multiplier: 0.024, offset: 0.0}
  "т/ч":      {category: mass_rate, multiplier: 24.0, offset: 0.0}
  "t/h":      {category: mass_rate, multiplier: 24.0, offset: 0.0}
  "кг/сут":   {category: mass_rate, multiplier: 0.001, offset: 0.0}
  "т/год":    {category: mass_rate, multiplier: 0.00273973, offset: 0.0}  # /365
  "г/мин":    {category: mass_rate, multiplier: 0.00144, offset: 0.0}  # 03.07: 1 г/мин = 1.44 кг/сут
  "g/min":    {category: mass_rate, multiplier: 0.00144, offset: 0.0}
  "г/ч":      {category: mass_rate, multiplier: 0.000024, offset: 0.0}
  "кг/мин":   {category: mass_rate, multiplier: 1.44, offset: 0.0}

  # --- Плотность → г/см³ (03.07, статья №17) ---
  "г/см³":    {category: density, multiplier: 1.0, offset: 0.0}
  "г/см3":    {category: density, multiplier: 1.0, offset: 0.0}
  "g/cm³":    {category: density, multiplier: 1.0, offset: 0.0}
  "g/cm3":    {category: density, multiplier: 1.0, offset: 0.0}
  "кг/м³":    {category: density, multiplier: 0.001, offset: 0.0}
  "кг/м3":    {category: density, multiplier: 0.001, offset: 0.0}

  # --- Вязкость → Па·с (03.07: пуазы в таблицах; «П∙10-3» = значения в 10⁻³ П) ---
  "Па·с":     {category: viscosity, multiplier: 1.0, offset: 0.0}
  "Па*с":     {category: viscosity, multiplier: 1.0, offset: 0.0}
  "Pa·s":     {category: viscosity, multiplier: 1.0, offset: 0.0}
  "мПа·с":    {category: viscosity, multiplier: 0.001, offset: 0.0}
  "П":        {category: viscosity, multiplier: 0.1, offset: 0.0}     # пуаз
  "П∙10-3":   {category: viscosity, multiplier: 0.0001, offset: 0.0}  # 10⁻³ пуаза
  "П·10-3":   {category: viscosity, multiplier: 0.0001, offset: 0.0}
  "сП":       {category: viscosity, multiplier: 0.001, offset: 0.0}   # сантипуаз

  # --- Размер частиц → мкм (03.07) ---
  "мкм":      {category: size, multiplier: 1.0, offset: 0.0}
  "µm":       {category: size, multiplier: 1.0, offset: 0.0}
  "um":       {category: size, multiplier: 1.0, offset: 0.0}
  "мм":       {category: size, multiplier: 1000.0, offset: 0.0}
  "нм":       {category: size, multiplier: 0.001, offset: 0.0}

  # --- Время → мин (03.07: «время выдержки 30 минут», «продувка 2 ч») ---
  "мин":      {category: time, multiplier: 1.0, offset: 0.0}
  "минут":    {category: time, multiplier: 1.0, offset: 0.0}
  "минуты":   {category: time, multiplier: 1.0, offset: 0.0}
  "минуток":  {category: time, multiplier: 1.0, offset: 0.0}
  "min":      {category: time, multiplier: 1.0, offset: 0.0}
  "ч":        {category: time, multiplier: 60.0, offset: 0.0}
  "час":      {category: time, multiplier: 60.0, offset: 0.0}
  "часа":     {category: time, multiplier: 60.0, offset: 0.0}
  "часов":    {category: time, multiplier: 60.0, offset: 0.0}
  "h":        {category: time, multiplier: 60.0, offset: 0.0}
  "с":        {category: time, multiplier: 0.0166667, offset: 0.0}   # секунда; кир. «с» ≠ «С» (Цельсий)!
  "сек":      {category: time, multiplier: 0.0166667, offset: 0.0}
  "s":        {category: time, multiplier: 0.0166667, offset: 0.0}
  "сут":      {category: time, multiplier: 1440.0, offset: 0.0}
  "суток":    {category: time, multiplier: 1440.0, offset: 0.0}

  # --- Плотность тока → А/м² ---
  "А/м²":     {category: current_density, multiplier: 1.0, offset: 0.0}
  "А/м2":     {category: current_density, multiplier: 1.0, offset: 0.0}
  "A/m²":     {category: current_density, multiplier: 1.0, offset: 0.0}
  "A/m2":     {category: current_density, multiplier: 1.0, offset: 0.0}
  "А/дм²":    {category: current_density, multiplier: 100.0, offset: 0.0}  # 1 А/дм² = 100 А/м²
  "А/дм2":    {category: current_density, multiplier: 100.0, offset: 0.0}
  "A/dm²":    {category: current_density, multiplier: 100.0, offset: 0.0}
  "мА/см²":   {category: current_density, multiplier: 10.0, offset: 0.0}   # 1 мА/см² = 10 А/м²

  # --- Напряжение → В ---
  "В":        {category: voltage, multiplier: 1.0, offset: 0.0}
  "V":        {category: voltage, multiplier: 1.0, offset: 0.0}
  "мВ":       {category: voltage, multiplier: 0.001, offset: 0.0}
  "mV":       {category: voltage, multiplier: 0.001, offset: 0.0}
  "кВ":       {category: voltage, multiplier: 1000.0, offset: 0.0}
  "kV":       {category: voltage, multiplier: 1000.0, offset: 0.0}

  # --- Доля / выход / степень извлечения → % ---
  "%":        {category: recovery, multiplier: 1.0, offset: 0.0}
  "процентов": {category: recovery, multiplier: 1.0, offset: 0.0}
  "%масс":    {category: recovery, multiplier: 1.0, offset: 0.0}
  "мас.%":    {category: recovery, multiplier: 1.0, offset: 0.0}
  "об.%":     {category: recovery, multiplier: 1.0, offset: 0.0}
  "г/т":      {category: recovery, multiplier: 0.0001, offset: 0.0}  # ппм по массе ≈ 1e-4 %

  # --- Экономические (ТЭП, §1 сценарий 6) → руб/т ---
  "руб/т":    {category: economic, multiplier: 1.0, offset: 0.0}
  "руб./т":   {category: economic, multiplier: 1.0, offset: 0.0}
  "р/т":      {category: economic, multiplier: 1.0, offset: 0.0}
  "руб/тонну": {category: economic, multiplier: 1.0, offset: 0.0}
  "тыс. руб/т": {category: economic, multiplier: 1000.0, offset: 0.0}
  "$/т":      {category: economic, multiplier: null, offset: 0.0}   # курс валют не конвертируем
  "$/t":      {category: economic, multiplier: null, offset: 0.0}
  "USD/т":    {category: economic, multiplier: null, offset: 0.0}
  "долл/т":   {category: economic, multiplier: null, offset: 0.0}

  # --- Пополнение 03.07-2 (второй проход qwen): масс.%, навески, объёмы ---
  "% масс.":  {category: recovery, multiplier: 1.0, offset: 0.0}   # массовая доля
  "%масс":    {category: recovery, multiplier: 1.0, offset: 0.0}
  "масс.%":   {category: recovery, multiplier: 1.0, offset: 0.0}
  "% об.":    {category: recovery, multiplier: 1.0, offset: 0.0}   # объёмная доля
  "г":        {category: mass, multiplier: 1.0, offset: 0.0}
  "кг":       {category: mass, multiplier: 1000.0, offset: 0.0}
  "мг":       {category: mass, multiplier: 0.001, offset: 0.0}
  "т":        {category: mass, multiplier: 1000000.0, offset: 0.0}
  "л":        {category: volume, multiplier: 1.0, offset: 0.0}
  "дм3":      {category: volume, multiplier: 1.0, offset: 0.0}
  "дм³":      {category: volume, multiplier: 1.0, offset: 0.0}
  "мл":       {category: volume, multiplier: 0.001, offset: 0.0}
  "м3":       {category: volume, multiplier: 1000.0, offset: 0.0}
  "м³":       {category: volume, multiplier: 1000.0, offset: 0.0}

  # --- Пополнение 03.07-3 (консолидация по графу): геомеханика / сейсмика ---
  # Единицы из документов по буровзрывным работам и НДС массива, флагавшиеся как
  # unknown_units (§4.3, уровень 2). Конвертации точны и однозначны.
  #
  # Длина → м. ВНИМАНИЕ: «мм» уже занята категорией size (→мкм, размер частиц) —
  # не переопределяем; для линейных размеров блоков/скважин достаточно «м» и «см».
  "м":        {category: length, multiplier: 1.0, offset: 0.0}
  "m":        {category: length, multiplier: 1.0, offset: 0.0}
  "см":       {category: length, multiplier: 0.01, offset: 0.0}
  "cm":       {category: length, multiplier: 0.01, offset: 0.0}

  # Частота → Гц (диапазон частот сейсмовзрывных волн, собственные частоты).
  "Гц":       {category: frequency, multiplier: 1.0, offset: 0.0}
  "Hz":       {category: frequency, multiplier: 1.0, offset: 0.0}
  "кГц":      {category: frequency, multiplier: 1000.0, offset: 0.0}
  "kHz":      {category: frequency, multiplier: 1000.0, offset: 0.0}

  # Скорость → м/с (скорость продольных волн ~6000 м/с; PVS в см/с).
  "м/с":      {category: velocity, multiplier: 1.0, offset: 0.0}
  "m/s":      {category: velocity, multiplier: 1.0, offset: 0.0}
  "см/с":     {category: velocity, multiplier: 0.01, offset: 0.0}
  "cm/s":     {category: velocity, multiplier: 0.01, offset: 0.0}
  "мм/с":     {category: velocity, multiplier: 0.001, offset: 0.0}
  "mm/s":     {category: velocity, multiplier: 0.001, offset: 0.0}
  "км/с":     {category: velocity, multiplier: 1000.0, offset: 0.0}

  # Угол → град (угол падения залежи, наклон скважин). Радиан — точный коэффициент.
  "град":     {category: angle, multiplier: 1.0, offset: 0.0}
  "градус":   {category: angle, multiplier: 1.0, offset: 0.0}
  "°":        {category: angle, multiplier: 1.0, offset: 0.0}
  "deg":      {category: angle, multiplier: 1.0, offset: 0.0}
  "рад":      {category: angle, multiplier: 57.2957795, offset: 0.0}   # 180/π град в 1 рад
  "rad":      {category: angle, multiplier: 57.2957795, offset: 0.0}

  # Площадь → см² (требуемое армирование сечения, см²). ВНИМАНИЕ: не путать с
  # плотностью тока А/м² и «см2»-как-площадь — здесь голая площадь.
  "см²":      {category: area, multiplier: 1.0, offset: 0.0}
  "см2":      {category: area, multiplier: 1.0, offset: 0.0}
  "cm²":      {category: area, multiplier: 1.0, offset: 0.0}
  "cm2":      {category: area, multiplier: 1.0, offset: 0.0}
  "мм²":      {category: area, multiplier: 0.01, offset: 0.0}    # 1 мм² = 0.01 см²
  "мм2":      {category: area, multiplier: 0.01, offset: 0.0}
  "м²":       {category: area, multiplier: 10000.0, offset: 0.0} # 1 м² = 10000 см²
  "m²":       {category: area, multiplier: 10000.0, offset: 0.0}

  # Энергия → Дж (энергия сейсмособытия, десятки–сотни тыс. Дж).
  "Дж":       {category: energy, multiplier: 1.0, offset: 0.0}
  "J":        {category: energy, multiplier: 1.0, offset: 0.0}
  "кДж":      {category: energy, multiplier: 1000.0, offset: 0.0}
  "kJ":       {category: energy, multiplier: 1000.0, offset: 0.0}
  "МДж":      {category: energy, multiplier: 1000000.0, offset: 0.0}
  "MJ":       {category: energy, multiplier: 1000000.0, offset: 0.0}
